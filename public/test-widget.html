<!DOCTYPE html>
<html>
<head><title>Widget Test</title></head>
<body style="font-family:sans-serif;padding:40px;">
  <h1>GEM Feedback Widget Test Page</h1>
  <p>This page tests the embeddable widget script.</p>
  <p>The floating chat icon should appear in the bottom-right corner.</p>
  <script>
    (function(d,t){
      var v=d.createElement(t),s=d.getElementsByTagName(t)[0];
      v.onload=function(){
        window.gemFeedback.load({
          url: "http://localhost:3000"
        }).then(function(){
          setTimeout(function(){ window.gemFeedback.open(); }, 1000);
        });
      };
      v.src="http://localhost:3000/widget.js";
      v.type="text/javascript";
      s.parentNode.insertBefore(v,s);
    })(document,'script');
  </script>
</body>
</html>
